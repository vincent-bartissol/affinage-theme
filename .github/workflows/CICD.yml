name: CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

jobs:
  # lhci:
  # name: Lighthouse
  # runs-on: ubuntu-latest
  # steps:
  #   - uses: actions/checkout@v4
  #   - name: Lighthouse
  #     uses: shopify/lighthouse-ci-action@v1
  #     with:
  #       store: ${{ secrets.SHOP_STORE_OS2 }}
  #       password: ${{ secrets.SHOP_PASSWORD_OS2 }}
  #       access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
  #       collection_handle: all
  #       lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
  #       pull_theme: ${{ secrets.SHOP_PULL_THEME }}

  # theme-check:
  #   name: Theme Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Theme Check
  #       uses: shopify/theme-check-action@v2
  #       with:
  #         token: ${{ github.token }}

  deploy-development:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        run: pnpm vite:build

      - name: Set theme name to branch name
        id: set-theme-name
        run: echo "THEME_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_ENV

      - name: Check if theme exists
        id: check-theme
        run: |
          themes="$(pnpm exec shopify theme list --json --name "${THEME_NAME}" --store vincent-store-dev.myshopify.com --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}")"
          if echo "${themes}" | jq -e --arg name "${THEME_NAME}" '(if type == "array" then . else (.themes // []) end) | any(.name == $name)' > /dev/null; then
            echo "Theme exists"
            echo "THEME_EXISTS=true" >> "${GITHUB_ENV}"
          else
            echo "Theme does not exist"
            echo "THEME_EXISTS=false" >> "${GITHUB_ENV}"
          fi

      - name: Create new theme if it doesn't exist
        if: env.THEME_EXISTS == 'false'
        run: |
          pnpm exec shopify theme push --unpublished --theme ${{ env.THEME_NAME }} --store vincent-store-dev.myshopify.com --password ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

      - name: Deploy theme to Shopify Development
        run: |
          pnpm exec shopify theme push \
            --json \
            --theme ${{ env.THEME_NAME }} \
            --store vincent-store-dev.myshopify.com \
            --password ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

  delete-development-theme:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set theme name to branch name
        id: set-theme-name
        run: echo "THEME_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_ENV

      - name: Delete development theme
        run: |
          pnpm exec shopify theme delete --theme ${{ env.THEME_NAME }} --store vincent-store-dev.myshopify.com --password ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }} --force

  deploy-staging:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        run: pnpm vite:build

      - name: Deploy theme to Shopify Staging
        run: |
          pnpm exec shopify theme push \
            --json \
            --theme 120929550451 \
            --store vincent-store-dev.myshopify.com \
            --password ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        run: pnpm vite:build

      - name: Deploy theme to Shopify Production
        run: |
          pnpm exec shopify theme push \
            --json \
            --allow-live \
            --theme 136285159539 \
            --store vincent-store-dev.myshopify.com \
            --password ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
