name: CI
on: [push]
jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        run: pnpm vite:build

      - name: Resolve storefront URLs
        id: urls
        env:
          SHOP_ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          SHOP_STORE: ${{ secrets.SHOP_STORE_OS2 }}
        run: |
          store="${SHOP_STORE#https://}"
          store="${store#http://}"
          store="${store%%/*}"
          product_handle="$(curl -sS -f -H "X-Shopify-Access-Token: ${SHOP_ACCESS_TOKEN}" \
            "https://${store}/admin/api/2026-01/products.json?published_status=published&limit=1" \
            | jq -r '.products[0].handle')"
          if [ -z "${product_handle}" ] || [ "${product_handle}" = "null" ]; then
            echo "No published product found for the product page audit."
            exit 1
          fi
          echo "store=${store}" >> "${GITHUB_OUTPUT}"
          echo "product_handle=${product_handle}" >> "${GITHUB_OUTPUT}"

      - name: Push preview theme
        id: theme
        env:
          SHOPIFY_FLAG_STORE: ${{ steps.urls.outputs.store }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          CI: '1'
        run: |
          pnpm exec shopify theme push --unpublished --json --theme "lhci-${GITHUB_RUN_ID}" > theme-push.json
          theme_id="$(jq -r '.theme.id // .id' theme-push.json)"
          if [ -z "${theme_id}" ] || [ "${theme_id}" = "null" ]; then
            echo "Theme push did not return a theme id."
            cat theme-push.json
            exit 1
          fi
          echo "theme_id=${theme_id}" >> "${GITHUB_OUTPUT}"

      - name: Run Lighthouse
        id: lhci
        env:
          SHOP_HOST: https://${{ steps.urls.outputs.store }}
          SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD_OS2 }}
          PREVIEW_QUERY: ?preview_theme_id=${{ steps.theme.outputs.theme_id }}&_fd=0&pb=0
          PREVIEW_URL: https://${{ steps.urls.outputs.store }}/?preview_theme_id=${{ steps.theme.outputs.theme_id }}&_fd=0&pb=0
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          PRODUCT_HANDLE: ${{ steps.urls.outputs.product_handle }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const host = process.env.SHOP_HOST;
          const query = process.env.PREVIEW_QUERY;
          const product = process.env.PRODUCT_HANDLE;
          const budgets = {
            performance: 0.6,
            accessibility: 0.9,
          };
          const config = {
            ci: {
              collect: {
                numberOfRuns: 1,
                url: [
                  `${host}/${query}`,
                  `${host}/products/${product}${query}`,
                  `${host}/collections/all${query}`,
                  `${host}/cart${query}`,
                ],
                puppeteerScript: '.github/lighthouse/set-preview-cookies.cjs',
                puppeteerLaunchOptions: {
                  executablePath: process.env.CHROME_PATH,
                  args: [
                    '--no-sandbox',
                    '--disable-setuid-sandbox',
                    '--disable-dev-shm-usage',
                    '--disable-gpu',
                  ],
                },
                settings: {
                  chromeFlags: '--no-sandbox --disable-dev-shm-usage',
                },
              },
              upload: { target: 'temporary-public-storage' },
              assert: {
                assertions: {
                  'categories:performance': ['error', { minScore: budgets.performance }],
                  'categories:accessibility': ['error', { minScore: budgets.accessibility }],
                },
              },
            },
          };
          fs.writeFileSync('lighthouserc.json', JSON.stringify(config, null, 2));
          fs.writeFileSync('.lighthouse-budgets.json', JSON.stringify(budgets, null, 2));
          NODE

          set +e
          pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
          lhci_exit=$?
          set -e

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const budgets = JSON.parse(fs.readFileSync('.lighthouse-budgets.json', 'utf8'));
          const manifestPath = '.lighthouseci/manifest.json';
          const assertionPath = '.lighthouseci/assertion-results.json';

          const pct = (score) =>
            score == null || Number.isNaN(score) ? 'n/a' : `${Math.round(score * 100)}`;
          const shortUrl = (url) => {
            try {
              const u = new URL(url);
              return `${u.pathname || '/'}${u.search ? '?…' : ''}`;
            } catch {
              return url;
            }
          };
          const statusFor = (category, score) => {
            const min = budgets[category];
            if (min == null || score == null) return '—';
            return score >= min ? 'PASS' : 'FAIL';
          };

          const lines = [];
          const push = (line = '') => lines.push(line);

          push('========================================');
          push(' Lighthouse results');
          push('========================================');
          push('');
          push('Budgets (minimum scores)');
          push('------------------------');
          for (const [category, min] of Object.entries(budgets)) {
            push(`  ${category.padEnd(16)} >= ${pct(min)}`);
          }
          push('');

          if (!fs.existsSync(manifestPath)) {
            push('No .lighthouseci/manifest.json found — collect may have failed before reports were written.');
          } else {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const runs = manifest.filter((run) => run.isRepresentativeRun !== false);

            push('Category scores by page');
            push('-----------------------');
            push(
              [
                'Page'.padEnd(28),
                'Perf'.padStart(6),
                'A11y'.padStart(6),
                'BP'.padStart(6),
                'SEO'.padStart(6),
                'Perf vs budget'.padStart(14),
                'A11y vs budget'.padStart(14),
              ].join('  '),
            );
            push('-'.repeat(88));

            for (const run of runs) {
              const s = run.summary || {};
              const page = shortUrl(run.url).slice(0, 28).padEnd(28);
              push(
                [
                  page,
                  pct(s.performance).padStart(6),
                  pct(s.accessibility).padStart(6),
                  pct(s['best-practices']).padStart(6),
                  pct(s.seo).padStart(6),
                  statusFor('performance', s.performance).padStart(14),
                  statusFor('accessibility', s.accessibility).padStart(14),
                ].join('  '),
              );
            }

            push('');
            push('Report links');
            push('------------');
            for (const run of runs) {
              const report =
                run.remoteReportUrl ||
                run.htmlPath ||
                (run.jsonPath ? path.basename(run.jsonPath) : 'n/a');
              push(`  ${shortUrl(run.url)}`);
              push(`    ${report}`);
            }
          }

          push('');
          if (fs.existsSync(assertionPath)) {
            const assertions = JSON.parse(fs.readFileSync(assertionPath, 'utf8'));
            const failed = (Array.isArray(assertions) ? assertions : []).filter(
              (a) => a.level === 'error' || a.passed === false,
            );
            push('Assertion results');
            push('-----------------');
            if (!failed.length) {
              push('  All asserted budgets passed.');
            } else {
              for (const a of failed) {
                const actual =
                  a.actual == null && a.values
                    ? a.values.map((v) => pct(v)).join(', ')
                    : a.actual;
                push(
                  `  FAIL  ${a.url ? shortUrl(a.url) + ' · ' : ''}${a.name || a.auditId || 'assertion'}` +
                    `  actual=${actual}  expected ${a.operator || '>='} ${a.expected ?? pct(budgets[String(a.name || '').replace('categories:', '')])}`,
                );
              }
            }
          } else {
            push('Assertion results');
            push('-----------------');
            push('  No assertion-results.json (assert step may not have run).');
          }

          push('');
          push('========================================');

          const text = lines.join('\n');
          console.log(text);

          if (process.env.GITHUB_STEP_SUMMARY) {
            const md = [];
            md.push('## Lighthouse results');
            md.push('');
            md.push('### Budgets');
            md.push('| Category | Minimum |');
            md.push('| --- | --- |');
            for (const [category, min] of Object.entries(budgets)) {
              md.push(`| ${category} | ${pct(min)} |`);
            }
            md.push('');
            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const runs = manifest.filter((run) => run.isRepresentativeRun !== false);
              md.push('### Scores by page');
              md.push('| Page | Performance | Accessibility | Best practices | SEO | Perf budget | A11y budget |');
              md.push('| --- | --- | --- | --- | --- | --- | --- |');
              for (const run of runs) {
                const s = run.summary || {};
                md.push(
                  `| \`${shortUrl(run.url)}\` | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s['best-practices'])} | ${pct(s.seo)} | ${statusFor('performance', s.performance)} | ${statusFor('accessibility', s.accessibility)} |`,
                );
              }
              md.push('');
              md.push('### Reports');
              for (const run of runs) {
                const report = run.remoteReportUrl || run.htmlPath || 'n/a';
                md.push(`- \`${shortUrl(run.url)}\`: ${report}`);
              }
            }
            if (fs.existsSync(assertionPath)) {
              const assertions = JSON.parse(fs.readFileSync(assertionPath, 'utf8'));
              const failed = (Array.isArray(assertions) ? assertions : []).filter(
                (a) => a.level === 'error' || a.passed === false,
              );
              md.push('');
              md.push('### Assertions');
              if (!failed.length) {
                md.push('All asserted budgets passed.');
              } else {
                for (const a of failed) {
                  md.push(
                    `- **FAIL** \`${a.name || a.auditId}\` on \`${a.url ? shortUrl(a.url) : 'n/a'}\` — actual \`${a.actual ?? a.values}\`, expected \`${a.operator || '>='} ${a.expected}\``,
                  );
                }
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${md.join('\n')}\n`);
          }
          NODE

          exit "${lhci_exit}"

      - name: Delete preview theme
        if: always() && steps.theme.outputs.theme_id != ''
        env:
          SHOPIFY_FLAG_STORE: ${{ steps.urls.outputs.store }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          CI: '1'
        run: pnpm exec shopify theme delete --theme "${{ steps.theme.outputs.theme_id }}" --force
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        run: pnpm vite:build

      - name: Theme Check
        run: pnpm exec shopify theme check
